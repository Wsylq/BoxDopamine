name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    outputs:
      dist-artifact: dist
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 1

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Install Capacitor dependencies
        run: |
          npm install @capacitor/core @capacitor/android @capacitor/haptics

      - name: Init Capacitor (if not already done)
        run: |
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            npx cap init "DopamineBox" "com.dopaminebox.app" --web-dir=dist
          fi

      - name: Create capacitor.config.json if missing
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.dopaminebox.app",
            "appName": "Dopamine Box",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF
          fi

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Patch Android manifest for network access
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Add INTERNET permission if missing
          if ! grep -q "INTERNET" "$MANIFEST"; then
            sed -i 's|<uses-permission android:name="android.permission.VIBRATE" />|<uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.INTERNET" />|' "$MANIFEST" || true
            # Fallback: insert after <manifest ...> line
            sed -i 's|<manifest |<manifest |' "$MANIFEST"
            python3 - << 'PYEOF'
          import re
          with open("android/app/src/main/AndroidManifest.xml", "r") as f:
              content = f.read()
          if 'INTERNET' not in content:
              content = content.replace(
                  '<manifest ',
                  '<manifest ',
              )
              # Insert permission before <application
              content = content.replace(
                  '<application',
                  '    <uses-permission android:name="android.permission.INTERNET" />\n    <application',
                  1
              )
              with open("android/app/src/main/AndroidManifest.xml", "w") as f:
                  f.write(content)
              print("Added INTERNET permission")
          else:
              print("INTERNET permission already present")
          PYEOF
          fi
          # Allow cleartext (ws://) traffic
          python3 - << 'PYEOF'
          with open("android/app/src/main/AndroidManifest.xml", "r") as f:
              content = f.read()
          if 'usesCleartextTraffic' not in content:
              content = content.replace(
                  '<application',
                  '<application\n        android:usesCleartextTraffic="true"',
                  1
              )
              with open("android/app/src/main/AndroidManifest.xml", "w") as f:
                  f.write(content)
              print("Added usesCleartextTraffic=true")
          else:
              print("usesCleartextTraffic already present")
          PYEOF

      - name: Copy web assets to Android
        run: npx cap copy android

      - name: Inject app icons
        run: |
          python3 - << 'PYEOF'
          from PIL import Image
          import os, shutil

          src = "public/app-icon/logo.jpeg"
          img = Image.open(src).convert("RGBA")

          # (density, launcher_size, foreground_size)
          densities = [
              ("mdpi",    48,  108),
              ("hdpi",    72,  162),
              ("xhdpi",   96,  216),
              ("xxhdpi",  144, 324),
              ("xxxhdpi", 192, 432),
          ]

          for density, launcher_px, fg_px in densities:
              folder = f"android/app/src/main/res/mipmap-{density}"
              os.makedirs(folder, exist_ok=True)
              img.resize((launcher_px, launcher_px), Image.Resampling.LANCZOS).save(f"{folder}/ic_launcher.png")
              img.resize((launcher_px, launcher_px), Image.Resampling.LANCZOS).save(f"{folder}/ic_launcher_round.png")
              img.resize((fg_px, fg_px), Image.Resampling.LANCZOS).save(f"{folder}/ic_launcher_foreground.png")
              print(f"✅ {density}: {launcher_px}px launcher, {fg_px}px foreground")

          # Set black background
          bg = "android/app/src/main/res/values/ic_launcher_background.xml"
          if os.path.exists(bg):
              with open(bg) as f:
                  content = f.read()
              content = content.replace("#6200EE", "#000000").replace("#FFFFFF", "#000000")
              with open(bg, "w") as f:
                  f.write(content)
              print("✅ Background set to #000000")
          PYEOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix Kotlin version conflict
        working-directory: android
        run: |
          printf '\nkotlin.version=1.8.22\nandroid.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx2048m\n' >> gradle.properties
          python3 - << 'PYEOF'
          import os
          build_gradle = 'build.gradle'
          with open(build_gradle, 'r') as f:
              content = f.read()
          if 'resolutionStrategy' not in content:
              patch = """
          subprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22'
                  }
              }
          }
          """
              with open(build_gradle, 'a') as f:
                  f.write(patch)
              print('resolutionStrategy block added.')
          else:
              print('resolutionStrategy already present, skipping.')
          PYEOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Clean build
        working-directory: android
        run: ./gradlew clean --no-daemon

      - name: Update Android version
        working-directory: android
        run: |
          VERSION_CODE=${{ github.run_number }}
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" app/build.gradle || true

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dopamine-box-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release (on main push)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Dopamine Box Build #${{ github.run_number }}"
          body: |
            ## 🎰 Dopamine Box APK

            **Build:** #${{ github.run_number }}
            **Commit:** ${{ github.sha }}

            ### Install
            1. Download `app-debug.apk` below
            2. On your Android device: Settings → Security → Allow unknown sources
            3. Open the downloaded APK and install
            4. Launch **Dopamine Box** 🎰

            > Debug build — signed with default debug keystore
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
